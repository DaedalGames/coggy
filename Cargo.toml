[workspace]
resolver = "3"
members = [
    "coggyd",
    "sessionbench",
    "workloads/cpu-spin",
    "workloads/file-write",
    "workloads/stdout-storm",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
# Edition 2024 itself needs only 1.85. The binding constraint is sysinfo 0.37,
# which declares rust-version 1.88 — so that is the real floor. Do not lower
# this without checking every dependency's declared rust-version first; a
# pinned rust-toolchain.toml hides violations by construction.
rust-version = "1.88"
license = "GPL-3.0-or-later"
repository = "https://github.com/DaedalGames/coggy"
authors = ["Daedal Games"]

# Lints live here rather than per crate so a workload cannot be held to a looser
# standard than the instrument measuring with it.
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.37"
portable-pty = "0.9"
win32job = "2"
# Core parking, read through WMI. MIT. The counter that says how many cores this
# box is actually offering is `Win32_PerfFormattedData_Counters_ProcessorInformation`
# -> `ParkingStatus`, and PDH would need `unsafe`, which the workspace forbids.
# Reached for through a crate rather than through FFI for the same reason
# `win32job` is, and verified before adding: the class exposes the property on
# this machine, and WMI reported 12 of 16 parked against the perf counter's 11
# seconds apart, which is agreement for a count that swings 0-12 within seconds.
wmi = "0.18"
# Placeholder expansion for a session's argv. MIT OR Apache-2.0. Braces-only
# on purpose: the better-known `subst` escapes with a backslash, which is the
# Windows path separator, so the paths this exists to build cannot be written.
envsubst = "0.2"
thread-priority = "2"
humansize = "2"
vergen = { version = "9", features = ["cargo", "rustc"] }

[profile.release]
lto = "thin"
# No codegen-units = 1. It was here without a measurement behind it, cost 35% of
# every incremental release build (8.3s against 5.4s), and moved the sampler's
# worst tick by nothing at all — 35 to 48 ms either way. The instrument's time
# is spent in system calls, which no amount of codegen tuning reaches.
# No panic = "abort" here on purpose. A panicking measurement thread must not
# take the whole run with it — a failed session is data to report, not a reason
# to lose the other 199 readings.
